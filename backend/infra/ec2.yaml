AWSTemplateFormatVersion: '2010-09-09'
Description: Gaesup character studio API on one instance with S3 durability and SSM administration, optionally reachable over HTTPS through CloudFront
# A stack update deploys UserData with ReleaseKey: pass the release the instance runs now (the SSM parameter
# /asset-studio/current-release that deploy-on-instance.sh writes, /opt/asset-studio/current.json, or
# backend/dist/aws/deployment-receipt.json), or a replaced instance boots an older one. A change to the instance role's
# permissions alone goes through backend/infra/update-studio-role.py, which refuses a change set that touches the instance.
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  SubnetId: {Type: 'AWS::EC2::Subnet::Id'}
  AssetBucket:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  ReleaseKey:
    Type: String
    AllowedPattern: '^releases/studio/[0-9a-f]{64}\.tar\.gz$'
  ProviderSecretArn:
    Type: String
    AllowedPattern: '^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
  CharacterDbSecretArn:
    Type: String
    Default: ''
    Description: The mogaesup server stack's CharacterDatabaseSecretArn output. With CharacterDbHost the studio keeps its job records in PostgreSQL (CHARACTER_DATABASE_URL); both empty keeps them in S3.
    AllowedPattern: '^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
  CharacterDbHost:
    Type: String
    Default: ''
    Description: The records database host, the server stack's DatabaseEndpoint output.
    AllowedPattern: '^$|^[A-Za-z0-9.-]+$'
  PublicStudio:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: When true, a CloudFront HTTPS address serves the studio API, and port 80 accepts CloudFront only. With STUDIO_GATEWAY_KEY in the provider secret, nginx also answers 403 to requests that do not send it as x-gateway-key.
  CloudFrontPrefixListId:
    Type: String
    Default: ''
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing in this Region. Required when PublicStudio is true.
    AllowedPattern: '^$|^pl-[0-9a-f]+$'
  InstanceType: {Type: String, Default: t3.large, AllowedValues: [t3.large, t3.xlarge, c7i.large, c7i.xlarge]}
  ImageId:
    # Pinned, with no default: another image replaces the instance, and the deploy role (SendCommand), the server
    # (StartInstances, STUDIO_INSTANCE_ID) and the studio gate all name the instance it replaces. Pass the image it runs:
    #   aws ec2 describe-instances --instance-ids <InstanceId output> --query 'Reservations[0].Instances[0].ImageId' --output text
    # (update-studio-role.py looks it up). A new stack takes the current AL2023 image:
    #   aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 --query Parameter.Value --output text
    Type: 'AWS::EC2::Image::Id'
  IdleStop:
    Type: String
    Default: ''
    AllowedValues: ['', 'off']
    Description: off writes IDLE_STOP=off to /etc/asset-studio-idle.env on the first boot, so a new instance stays on (infra/idle-stop.sh). Empty leaves the user data as it was; a change of this value stops and starts the instance once.
Rules:
  PublicStudioOrigin:
    RuleCondition: !Equals [!Ref PublicStudio, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref CloudFrontPrefixListId, '']]
        AssertDescription: CloudFrontPrefixListId is required when PublicStudio is true
  CharacterDbPair:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref CharacterDbSecretArn, '']
            - !Equals [!Ref CharacterDbHost, '']
          - !And
            - !Not [!Equals [!Ref CharacterDbSecretArn, '']]
            - !Not [!Equals [!Ref CharacterDbHost, '']]
        AssertDescription: CharacterDbSecretArn and CharacterDbHost must be supplied together
Conditions:
  HasCharacterDb: !And [!Not [!Equals [!Ref CharacterDbSecretArn, '']], !Not [!Equals [!Ref CharacterDbHost, '']]]
  HasPublicStudio: !Equals [!Ref PublicStudio, 'true']
  StaysOn: !Equals [!Ref IdleStop, 'off']
  IsUsEast1: !Equals [!Ref 'AWS::Region', us-east-1]
Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
  # The role's own permissions, apart from the role and the instance: a change here is an IAM-only update
  # (update-studio-role.py checks the change set for that before it runs it).
  StudioAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: StudioAccess
      Roles: [!Ref InstanceRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['s3:ListBucket']
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${AssetBucket}'
            Condition: {StringLike: {'s3:prefix': ['assets/*', 'releases/*']}}
          # The studio deletes objects it replaces or archives (StoredPath.unlink); the bucket is versioned.
          - Effect: Allow
            Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject']
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${AssetBucket}/assets/*'
          - Effect: Allow
            Action: ['s3:GetObject']
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${AssetBucket}/releases/studio/*'
          # deploy-on-instance.sh reads the provider secret and, when given, the records database secret.
          - Effect: Allow
            Action: ['secretsmanager:GetSecretValue']
            Resource:
              - !Ref ProviderSecretArn
              - !If [HasCharacterDb, !Ref CharacterDbSecretArn, !Ref AWS::NoValue]
          # deploy-on-instance.sh records the release it installed, the ReleaseKey a later stack update passes.
          - Effect: Allow
            Action: ['ssm:PutParameter']
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/asset-studio/current-release'
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # The text the group was created with: a new description replaces the group, and with it the instance (its network
      # interface names the group). Port 80 is CloudFront's only (CloudFrontHttpIngress).
      GroupDescription: SSM administration with optional public static HTTP
      VpcId: !Ref VpcId
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
  CloudFrontHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasPublicStudio
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontPrefixListId
      Description: CloudFront origin requests
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Profile
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1}
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 60, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: gaesup-asset-studio}]
      UserData:
        # Without a records database this renders exactly as before CharacterDbConfig existed, so the user data does not
        # change. With one, the two lines are what records-to-postgres.py appends by hand.
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            # curl-minimal already provides curl; installing the full package conflicts with it.
            dnf install -y docker
            systemctl enable --now docker
            install -d -m 700 /opt/asset-studio
            cat > /etc/asset-studio.env <<'CONFIG'
            ASSET_S3_BUCKET='${AssetBucket}'
            AWS_REGION='${AWS::Region}'
            PROVIDER_SECRET_ARN='${ProviderSecretArn}'
            PUBLIC_STUDIO='${PublicStudio}'${CharacterDbConfig}
            CONFIG
            chmod 600 /etc/asset-studio.env${IdleStopConfig}
            release_sha="$(basename '${ReleaseKey}' .tar.gz)"
            exec 8>/var/lock/asset-studio-prepare.lock
            flock -n 8 || { echo 'another release preparation is active' >&2; exit 3; }
            incoming="/opt/asset-studio/incoming/$release_sha"
            install -d -m 700 "$incoming/source"
            aws s3 cp 's3://${AssetBucket}/${ReleaseKey}' "$incoming/release.tar.gz" --region '${AWS::Region}' --checksum-mode ENABLED --only-show-errors
            printf '%s  %s\n' "$release_sha" "$incoming/release.tar.gz" | sha256sum -c -
            tar -xzf "$incoming/release.tar.gz" -C "$incoming/source"
            printf '%s\n' "$release_sha" > "$incoming/source/.release-sha256"
            /bin/bash "$incoming/source/infra/deploy-on-instance.sh" '${ReleaseKey}' "$release_sha" "$incoming/source"
          - CharacterDbConfig: !If
              - HasCharacterDb
              - !Join
                - ''
                - - "\nCHARACTER_DB_SECRET_ARN='"
                  - !Ref CharacterDbSecretArn
                  - "'\nCHARACTER_DB_HOST='"
                  - !Ref CharacterDbHost
                  - "'"
              - ''
            # Empty unless IdleStop is off, so the user data stays as it was.
            IdleStopConfig: !If
              - StaysOn
              - "\necho IDLE_STOP=off > /etc/asset-studio-idle.env"
              - ''
  StudioAddress:
    # Fixed address so the CloudFront origin name survives instance stop and start.
    Type: AWS::EC2::EIP
    Condition: HasPublicStudio
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{Key: Name, Value: gaesup-asset-studio}]
  StudioCachePolicy:
    # Authorization must be part of the cache key for CloudFront to forward it on GET. So is x-gateway-key: CloudFront
    # caches an origin 403 for a few seconds, and the one nginx gives a request without the key (STUDIO_GATEWAY_KEY) must not
    # be served to a request that has it. DefaultTTL 0 keeps API responses uncached unless the origin asks otherwise.
    Type: AWS::CloudFront::CachePolicy
    Condition: HasPublicStudio
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-studio'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: {HeaderBehavior: whitelist, Headers: [Authorization, x-gateway-key]}
          CookiesConfig: {CookieBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: all}
  StudioDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasPublicStudio
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Gaesup asset studio
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: studio
            DomainName: !If
              - IsUsEast1
              - !Sub ['ec2-${Address}.compute-1.amazonaws.com', {Address: !Join ['-', !Split ['.', !GetAtt StudioAddress.PublicIp]]}]
              - !Sub ['ec2-${Address}.${AWS::Region}.compute.amazonaws.com', {Address: !Join ['-', !Split ['.', !GetAtt StudioAddress.PublicIp]]}]
            # Plain HTTP between CloudFront and the instance, x-gateway-key included: no certificate can name an EC2 public
            # DNS name. Closing it takes a CloudFront VPC origin (as server/infra/aws-server.yaml has), which needs the
            # instance in a private subnet, that is, a new instance.
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: studio
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref StudioCachePolicy
          # Managed-AllViewerExceptHostHeader
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
Outputs:
  InstanceId: {Value: !Ref Instance}
  Access: {Value: !Sub 'aws ssm start-session --target ${Instance} --document-name AWS-StartPortForwardingSession --parameters portNumber=8080,localPortNumber=8080'}
  StudioUrl:
    Condition: HasPublicStudio
    Value: !Sub 'https://${StudioDistribution.DomainName}'
