events {}
http {
  include /etc/nginx/mime.types;
  # The instance powers itself off after two hours without a request here (infra/idle-stop.sh reads this log's time
  # from the host's /var/log/asset-studio). Health and release probes are left out so they do not keep it on.
  map $uri $studio_activity {
    default 1;
    /health 0;
    /api/health 0;
    /version.json 0;
  }
  log_format studio_activity '$msec $status $request_method $uri';
  access_log /var/log/nginx/activity.log studio_activity if=$studio_activity;
  server {
    # Access requires an IAM-authorized SSM port-forwarding session, so no gateway key is asked for here.
    listen 127.0.0.1:8080;
    root /app/static;
    client_max_body_size 64m;
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-User-Id 1;
      proxy_set_header Host $host;
      proxy_read_timeout 65s;
      proxy_buffering off;
    }
    # Raw GLB uploads; the API streams them and caps each at 256 MiB.
    location ~ ^/api/(avatar-factory/base-bodies/glb-assets|studio/glb-assets/upload)$ {
      client_max_body_size 256m;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-User-Id 1;
      proxy_set_header Host $host;
      proxy_read_timeout 65s;
      proxy_buffering off;
    }
    location = /version.json { add_header Cache-Control "no-cache"; }
    location / { return 404; }
  }
  server {
    # CloudFormation opens port 80 for PublicSiteOrigin (anyone) or PublicStudio (CloudFront only).
    # entrypoint.py writes the rules: nothing by default; with PUBLIC_STUDIO the API, and with STUDIO_GATEWAY_KEY only for
    # requests that send it as x-gateway-key (403 otherwise).
    listen 80;
    client_max_body_size 64m;
    include /etc/nginx/studio-public.conf;
    location / { return 404; }
  }
}
