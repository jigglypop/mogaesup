events {}
http {
  include /etc/nginx/mime.types;
  server {
    # Access requires an IAM-authorized SSM port-forwarding session.
    listen 127.0.0.1:8080;
    root /app/frontend/dist;
    client_max_body_size 64m;
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-User-Id 1;
      proxy_set_header Host $host;
      proxy_read_timeout 65s;
      proxy_buffering off;
    }
    # Raw GLB uploads; the API streams them and caps each at 256 MiB.
    location ~ ^/api/(avatar-factory/base-bodies/glb-assets|studio/glb-assets/upload)$ {
      client_max_body_size 256m;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-User-Id 1;
      proxy_set_header Host $host;
      proxy_read_timeout 65s;
      proxy_buffering off;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }
  server {
    # CloudFormation opens port 80 only when PublicSiteOrigin is provided.
    # entrypoint.py writes the rules: a static site with /api closed, or, when a
    # studio login is configured, the whole studio behind password authentication.
    listen 80;
    root /app/frontend/dist;
    client_max_body_size 64m;
    include /etc/nginx/studio-public.conf;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  }
}
