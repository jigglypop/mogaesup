[project]
name = "asset-3d-api"
version = "0.1.0"
description = "FastAPI character server for the studio"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.36.0",  # PutObject IfNoneMatch and HeadObject ChecksumType (object_storage)
    "fastapi>=0.109.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pyjwt>=2.8.0",
    "psycopg[binary]>=3.2.0,<4",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.27.0",
    "psutil>=7.2,<8",
    "numpy>=1.26",
    "vtracer>=0.6.15",
]

[project.scripts]
asset-api = "src.cli:api"
asset-editor = "src.editor_cli:main"
asset-quality = "src.quality_cli:main"

[project.optional-dependencies]
blender = [
    "blender-mcp==1.9.1",
    "mcp>=1.9.0,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
