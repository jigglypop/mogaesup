name: 점검과 배포

# Pull requests and pushes to main run the checks of the parts they changed. A run on main that passes them deploys each
# part that changed since that part was last deployed: server, then studio, then web (the web calls the studio's
# endpoints through the server, so it goes last). Infrastructure (CloudFormation) is never applied here; the deploy role
# cannot do it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 배포할 곳
        type: choice
        options: [all, server, web, studio]
        default: all

permissions:
  contents: read

# The deploy lock. Runs on main wait for each other in the `production` group and are never cancelled midway; one still
# waiting when a newer run arrives is replaced by it, and every run deploys what each part still lacks since its last
# deploy (.github/scripts/deploy_bases.py), so nothing the replaced run would have deployed is lost. A deploy by hand goes
# through this workflow too (Run workflow, `target`), so it waits its turn in the same group; the scripts run from a PC
# refuse while a run here is queued or in progress, and the instances' install locks keep two installs apart. Pull
# requests and other branches only check, in a group of their own.
concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && format('check-{0}', github.ref) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::960243570517:role/mogaesup-github-deploy
  # Checks and the release binary use this one compiler (server/Cargo.toml asks for 1.95 or newer). The lints a newer
  # clippy (1.98) raised in server/src/look_bake.rs and looks.rs were fixed, but `cargo clippy --all-targets -D warnings`
  # has not been run with a newer toolchain yet: raise this, and RUST_IMAGE with it, once it passes there.
  RUST_VERSION: 1.95.0
  # rust:1.95.0-alpine, by digest: a retagged image cannot change the release build.
  RUST_IMAGE: rust:1.95.0-alpine@sha256:606fd313a0f49743ee2a7bd49a0914bab7deedb12791f3a846a34a4711db7ed2
  # The studio image installs this uv (backend/infra/Dockerfile); the checks resolve uv.lock with the same one.
  UV_VERSION: 0.11.9

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      server_check: ${{ steps.diff.outputs.server_check }}
      backend_check: ${{ steps.diff.outputs.backend_check }}
      frontend_check: ${{ steps.diff.outputs.frontend_check }}
      infra_check: ${{ steps.diff.outputs.infra_check }}
      deploy_server: ${{ steps.diff.outputs.deploy_server }}
      deploy_web: ${{ steps.diff.outputs.deploy_web }}
      deploy_studio: ${{ steps.diff.outputs.deploy_studio }}
    steps:
      # The routing compares commits by their file lists only, so the history comes without file contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: 마지막으로 배포한 커밋
        id: previous
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deploy_bases.py
      - name: 바뀐 곳
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.previous.outputs.check }}
          BASE_SERVER: ${{ steps.previous.outputs.server }}
          BASE_WEB: ${{ steps.previous.outputs.web }}
          BASE_STUDIO: ${{ steps.previous.outputs.studio }}
          TARGET: ${{ inputs.target }}
        run: bash .github/scripts/changes.sh

  server-check:
    needs: changes
    if: needs.changes.outputs.server_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # factory_contract.rs runs the character server's auth.py through uv and skips itself without it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      # Pull requests read main's cache; only main writes one, so they do not crowd it out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A failed release goes back to the previous binary on the migrated database, so migrations only add.
      - name: 마이그레이션은 더하기만
        run: python3 ../.github/scripts/check_migrations.py server/migrations
      - run: cargo fmt --check
      # Game modules are declared inside the `registry!` macro (src/games/mod.rs), where cargo fmt does not look.
      - run: rustfmt --edition 2024 --check $(find src/games -name '*.rs')
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # 3.11 is what .python-version and the local machines use; the studio image (backend/infra/Dockerfile) runs 3.12.
  backend-check:
    needs: changes
    if: needs.changes.outputs.backend_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      UV_PYTHON: ${{ matrix.python }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # The studio applies them before it stops the running release (backend/infra/deploy-on-instance.sh).
      - name: 마이그레이션은 더하기만
        run: python3 .github/scripts/check_migrations.py backend/migrations
      - run: uv sync --locked --extra studio-mcp
      - run: uv run --no-sync python -m compileall -q backend/src
      # PostgreSQL runs beside this job, so the record database tests must not skip themselves here.
      - run: uv run --no-sync pytest -q
        env:
          REQUIRE_TEST_DATABASE: '1'

  # The studio image as the instance builds it (from the release archive prepare-aws.ps1 packs, never pushed anywhere),
  # and its Blender running the helpers every worker imports. The tests above use a stand-in for Blender.
  studio-image:
    needs: changes
    if: needs.changes.outputs.backend_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 릴리스 묶음
        shell: pwsh
        run: ./backend/infra/prepare-aws.ps1 -PackOnly
      - name: 스튜디오 이미지
        run: |
          context="$RUNNER_TEMP/studio"
          mkdir -p "$context"
          tar -xzf backend/dist/aws/studio.tar.gz -C "$context"
          docker build --pull -t studio-check -f "$context/infra/Dockerfile" "$context"
      - name: Blender
        run: >-
          docker run --rm -v "$PWD/.github/scripts/blender_smoke.py:/smoke.py:ro" studio-check
          blender --background --factory-startup --python-exit-code 1 --python /smoke.py
      - name: 기록 DB 명령
        run: docker run --rm studio-check python -c "import src.records, src.services.record_store"
      # nginx.conf with the port-80 rules entrypoint.py writes for a public studio (a stand-in key, rotation included).
      - name: nginx 설정
        run: |
          docker run --rm studio-check sh -c 'python -c "
          import sys; sys.path.insert(0, \"/app\")
          from pathlib import Path
          import entrypoint
          entrypoint.write_public_rules(Path(\"/etc/nginx/studio-public.conf\"), True, \"k\" * 32, \"p\" * 32)
          " && nginx -t'

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `npm run build` would type-check again first.
      - name: 빌드
        run: npm exec --workspace frontend -- vite build
      # The source page and the built one: the build may rewrite the inline script.
      - name: 인라인 스크립트의 CSP 해시
        run: |
          python3 .github/scripts/check_csp.py --html frontend/index.html --template frontend/infra/aws-static.yaml
          python3 .github/scripts/check_csp.py --html frontend/dist/index.html --template frontend/infra/aws-static.yaml
      # deploy-web ships this build, so what goes live is what was checked, and no build tool runs where the deploy role
      # can be assumed.
      - name: 배포할 빌드
        if: needs.changes.outputs.deploy_web == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: |
            frontend/dist
            !frontend/dist/**/*.map
          retention-days: 3
          if-no-files-found: error

  infra-check:
    needs: changes
    if: needs.changes.outputs.infra_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: .github/requirements/cfn-lint.txt
      - name: 워크플로 문법과 변경 감지
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/pipeline.yml
          python3 .github/scripts/test_changes.py
          python3 .github/scripts/test_check_migrations.py
      # cfn-lint and every package it needs, pinned by hash.
      - name: CloudFormation 템플릿
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/cfn-lint"
          uv pip install --python "$RUNNER_TEMP/cfn-lint" --require-hashes -r .github/requirements/cfn-lint.txt
          "$RUNNER_TEMP/cfn-lint/bin/cfn-lint" --ignore-checks W1030 -- \
            frontend/infra/aws-static.yaml server/infra/aws-server.yaml backend/infra/ec2.yaml .github/aws/deploy-role.yaml
      - name: 스크립트 문법
        run: |
          python3 -m compileall -q server/scripts scripts/props backend/infra .github/scripts
          for file in $(git ls-files '*.sh'); do bash -n "$file"; done
      - name: PowerShell 문법
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in (git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).ProviderPath, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($problem in $errors) { Write-Host "::error file=$file,line=$($problem.Extent.StartLineNumber)::$($problem.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  gate:
    needs: [changes, server-check, backend-check, studio-image, frontend-check, infra-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: ${{ needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::점검이 실패해 배포하지 않습니다"
          exit 1

  # The release binary, built where the deploy role cannot be assumed (no id-token): only the binary and its digest
  # reach deploy-server. The source goes in read-only; the build writes only server/target (cached) and the crates.
  build-server:
    needs: changes
    if: needs.changes.outputs.deploy_server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.binary.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The crates and their release builds carry over between deploys; cargo rebuilds what changed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/musl-cargo
            server/target
          key: musl-${{ env.RUST_VERSION }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: musl-${{ env.RUST_VERSION }}-
      - name: 리눅스 릴리스 바이너리
        working-directory: server
        run: >-
          mkdir -p target "$HOME/.cache/musl-cargo/registry" &&
          docker run --rm
          -e "RUSTFLAGS=-C target-feature=+crt-static" -e CARGO_TARGET_DIR=/target
          -v "$HOME/.cache/musl-cargo/registry":/usr/local/cargo/registry
          -v "$PWD":/src:ro -v "$PWD/target":/target -w /src "$RUST_IMAGE"
          sh -c "apk add --no-cache musl-dev && cargo build --release --locked --target x86_64-unknown-linux-musl"
      - name: 바이너리
        id: binary
        working-directory: server/target/x86_64-unknown-linux-musl/release
        run: echo "sha256=$(sha256sum mogaesup-server | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-binary
          path: server/target/x86_64-unknown-linux-musl/release/mogaesup-server
          retention-days: 3
          if-no-files-found: error

  # .github/scripts/deploy_bases.py reads the deploy jobs by these ids (deploy-server, deploy-web, deploy-studio).
  # Each one first checks that its commit is still main's newest: a run created out of order, or an older run run
  # again, would put an older release back while every later run stays green. The jobs declare the GitHub environment
  # the deploy role trusts (.github/aws/deploy-role.yaml) once the repository variable DEPLOY_ENVIRONMENT names it.
  deploy-server:
    needs: [changes, gate, build-server]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.build-server.result == 'success' && needs.changes.outputs.deploy_server == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ vars.DEPLOY_ENVIRONMENT || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: main의 최신 커밋인지 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::이 실행의 커밋 $GITHUB_SHA 는 main의 최신($tip)이 아닙니다. 옛 커밋을 배포하면 운영이 되돌아가므로 main의 최신 실행이 배포합니다"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binary
          path: server/target/x86_64-unknown-linux-musl/release
      - name: 빌드한 바이너리인지 확인
        env:
          EXPECTED: ${{ needs.build-server.outputs.sha256 }}
        run: echo "$EXPECTED  server/target/x86_64-unknown-linux-musl/release/mogaesup-server" | sha256sum -c -
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # --skip-provision: the stack is not touched; the server keeps the FACTORY_* settings it has. The script also checks
      # that CloudFront (the web stack) sends /api/* to this stack's instance.
      - name: 서버 릴리스
        working-directory: server
        run: python3 scripts/deploy-rust-server.py --skip-provision
      - name: 운영 주소 확인
        run: curl --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 3 --retry-all-errors https://mogaesup.com/api/health
      - name: 설치 실패 기록
        if: failure()
        working-directory: server
        run: |
          for file in artifacts/*/ssm-result.json; do
            [ -f "$file" ] || continue
            python3 -c "import json, sys; d = json.load(open(sys.argv[1])); print(d.get('Status')); print(d.get('StandardErrorContent', '')[-4000:])" "$file"
          done

  deploy-studio:
    needs: [changes, gate, deploy-server]
    if: ${{ !cancelled() && needs.gate.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.deploy-server.result) && needs.changes.outputs.deploy_studio == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ${{ vars.DEPLOY_ENVIRONMENT || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: main의 최신 커밋인지 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::이 실행의 커밋 $GITHUB_SHA 는 main의 최신($tip)이 아닙니다. 옛 커밋을 배포하면 운영이 되돌아가므로 main의 최신 실행이 배포합니다"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # The instance may power itself off after two idle hours (backend/infra/idle-stop.sh, unless IDLE_STOP=off), and
      # this job does not start it. The studio then stays pending, and the web with it (it may call new studio
      # endpoints): once the instance is on, the next run on main (a push, or a manual run of any target) deploys both.
      - name: 스튜디오 인스턴스
        id: instance
        run: |
          id=$(aws cloudformation describe-stacks --stack-name gaesup-asset-studio --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)
          state=$(aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[0].Instances[0].State.Name' --output text)
          ping=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$id" --query 'InstanceInformationList[0].PingStatus' --output text)
          if [ "$state" != running ] || [ "$ping" != Online ]; then
            echo "::error::스튜디오 인스턴스 $id 가 꺼져 있거나 SSM에 닿지 않습니다 (상태 $state, SSM $ping). 켠 뒤 main에서 이 워크플로를 target=studio로 실행하세요"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: 릴리스 묶음
        shell: pwsh
        run: ./backend/infra/prepare-aws.ps1 -Upload
      # deploy-on-instance.sh applies the record database migrations, then waits for running paid work to finish and
      # stops with 4 or 5 when it cannot (backend/README.md).
      - name: 인스턴스에 배포
        shell: pwsh
        env:
          STUDIO_INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          $receipt = Get-Content backend/dist/aws/receipt.json -Raw | ConvertFrom-Json
          ./backend/infra/deploy-aws.ps1 -InstanceId $env:STUDIO_INSTANCE_ID -Bucket $receipt.bucket -ReleaseKey $receipt.release_key

  deploy-web:
    needs: [changes, gate, deploy-server, deploy-studio]
    if: ${{ !cancelled() && needs.gate.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.deploy-server.result) && contains(fromJSON('["success", "skipped"]'), needs.deploy-studio.result) && needs.changes.outputs.deploy_web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ vars.DEPLOY_ENVIRONMENT || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: main의 최신 커밋인지 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::이 실행의 커밋 $GITHUB_SHA 는 main의 최신($tip)이 아닙니다. 옛 커밋을 배포하면 운영이 되돌아가므로 main의 최신 실행이 배포합니다"
            exit 1
          fi
      # The build frontend-check made and checked in this run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: frontend/dist
      # Warnings only: the stack is applied by hand (-ProvisionOnly), and until then the site keeps its old policy.
      - name: 운영 CSP
        run: python3 .github/scripts/check_csp.py --html frontend/dist/index.html --live https://mogaesup.com --template frontend/infra/aws-static.yaml
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Uploads dist/ (the engine's WebAssembly and index.html last), invalidates CloudFront, checks the published site,
      # and puts the previous index.html and WebAssembly back when those checks fail.
      - name: 웹 릴리스
        shell: pwsh
        run: ./frontend/scripts/deploy-aws.ps1 -SkipBuild -SkipProvision
      # aws s3 cp guesses the type of the hashed assets from the runner's mime table; the browser needs JavaScript and CSS.
      - name: 운영 파일 형식
        run: |
          check() {
            type=$(curl --fail --silent --show-error --max-time 20 --head "https://mogaesup.com$1" | tr -d '\r' | awk -F': ' 'tolower($1) == "content-type" { print tolower($2) }')
            case "$type" in *"$2"*) echo "$1 $type" ;; *) echo "::error::$1 의 content-type이 $type 입니다"; exit 1 ;; esac
          }
          check "$(grep -oE '/assets/[^"]+\.js' frontend/dist/index.html | head -1)" javascript
          check "$(grep -oE '/assets/[^"]+\.css' frontend/dist/index.html | head -1)" text/css
