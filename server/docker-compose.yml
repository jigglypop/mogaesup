# Local PostgreSQL for the server and its tests. Port 55432 matches the character server's CHARACTER_DATABASE_URL (backend/.env).
name: mogaesup-server

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      POSTGRES_DB: mogaesup
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
