AWSTemplateFormatVersion: '2010-09-09'
Description: Mogaesup Rust server, private PostgreSQL RDS and private runtime S3. Single AZ, no NAT or load balancer.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetA:
    Type: AWS::EC2::Subnet::Id
  SubnetB:
    Type: AWS::EC2::Subnet::Id
  ImageId:
    # Pinned: a new image replaces the instance, so an ordinary update must not pick up the latest AL2023 by itself.
    Type: AWS::EC2::Image::Id
    Default: ami-03137ee2d0c5af1fe
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  CloudFrontPrefixList:
    Type: String
    Default: pl-22a6434b
  CloudFrontServiceGroup:
    Type: String
    Default: ''
    Description: CloudFront-VPCOrigins-Service-SG of this VPC, once CloudFront has created it.
  ModelBucketName:
    Type: String
    Default: mogaesup-web-960243570517-apne2
    Description: The web stack's bucket; catalog models go under models/, which CloudFront serves at /models/*.
  StudioInstanceId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^i-[0-9a-f]{8,17}$'
    Description: The character studio's EC2 instance (gaesup-asset-studio). It powers itself off when idle; the server may start it.
  SharedDatabaseEndpoint:
    Type: String
    Default: ''
    Description: A PostgreSQL instance shared with other stacks (choketmon-postgres) to use instead of this stack's own Database.
  SharedDatabaseSecretArn:
    Type: String
    Default: ''
    Description: That instance's RDS-managed master secret; the bootstrap creates the mogaesup database and its app role with it.
  SharedDatabaseSecurityGroup:
    Type: String
    Default: ''
    Description: That instance's security group; this stack adds ingress rules on 5432 for the server (and the studio).
  StudioSecurityGroup:
    Type: String
    Default: ''
    Description: The studio instance's security group, allowed into the shared database for the character records.
  StudioRoleArn:
    Type: String
    Default: ''
    Description: The studio instance's role, allowed to read the character records database secret.
Conditions:
  HasCloudFrontGroup: !Not [!Equals [!Ref CloudFrontServiceGroup, '']]
  HasStudioInstance: !Not [!Equals [!Ref StudioInstanceId, '']]
  UseSharedDatabase: !Not [!Equals [!Ref SharedDatabaseEndpoint, '']]
  StudioUsesSharedDatabase: !And [!Condition UseSharedDatabase, !Not [!Equals [!Ref StudioSecurityGroup, '']]]
  StudioReadsCharacterDatabase: !And [!Condition StudioUsesSharedDatabase, !Not [!Equals [!Ref StudioRoleArn, '']]]
Resources:
  RealtimeTicketSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Mogaesup live-room ticket signing key
      GenerateSecretString: {ExcludePunctuation: true, PasswordLength: 64}
      Tags: [{Key: application, Value: mogaesup}]
  FactoryGatewaySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Sent to the character studio as x-gateway-key; its CloudFront lets this server through with it
      GenerateSecretString: {ExcludePunctuation: true, PasswordLength: 48}
      Tags: [{Key: application, Value: mogaesup}]
  RuntimeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'mogaesup-runtime-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: RuntimeHistory
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 14}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags: [{Key: application, Value: mogaesup}]
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mogaesup server reachable only from the CloudFront origin network
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourcePrefixListId: !If [HasCloudFrontGroup, !Ref AWS::NoValue, !Ref CloudFrontPrefixList]
          SourceSecurityGroupId: !If [HasCloudFrontGroup, !Ref CloudFrontServiceGroup, !Ref AWS::NoValue]
      Tags: [{Key: application, Value: mogaesup}]
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL reachable only from the Mogaesup server security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt ApiSecurityGroup.GroupId
      Tags: [{Key: application, Value: mogaesup}]
  # The shared instance belongs to another stack; these rules are this stack's own and leave its template untouched.
  SharedDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseSharedDatabase
    Properties:
      GroupId: !Ref SharedDatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt ApiSecurityGroup.GroupId
      Description: mogaesup server
  StudioDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: StudioUsesSharedDatabase
    Properties:
      GroupId: !Ref SharedDatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref StudioSecurityGroup
      Description: mogaesup character studio records
  # The character studio's records (backend/, CHARACTER_DATABASE_URL) live in the shared instance too, under their own
  # role and database. CloudFormation generates the password; server/scripts/character-database.py creates the role
  # with it, and the studio reads it through the resource policy (backend/infra/deploy-on-instance.sh).
  CharacterDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Condition: StudioReadsCharacterDatabase
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: The character studio's records database role on the shared PostgreSQL
      GenerateSecretString:
        SecretStringTemplate: '{"username":"character_app","dbname":"mogaesup_character"}'
        GenerateStringKey: password
        ExcludePunctuation: true
        PasswordLength: 40
      Tags: [{Key: application, Value: mogaesup}]
  CharacterDatabaseSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: StudioReadsCharacterDatabase
    Properties:
      SecretId: !Ref CharacterDatabaseSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref StudioRoleArn}
            Action: secretsmanager:GetSecretValue
            Resource: '*'
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Mogaesup RDS subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: mogaesup-postgres
      DBName: mogaesup
      Engine: postgres
      # Pinned, with automatic minor upgrades off: RDS must not move the instance past this version, or the next stack
      # change to it would read as a downgrade. Take a minor upgrade by raising this.
      EngineVersion: '17.9'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: mogaesup
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: false
      AutoMinorVersionUpgrade: false
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnableCloudwatchLogsExports: [postgresql]
      Tags: [{Key: application, Value: mogaesup}]
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: MogaesupRuntimeRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${RuntimeBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RuntimeBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ModelBucketName}/models/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref RealtimeTicketSecret
                  - !Ref FactoryGatewaySecret
                  - !If [UseSharedDatabase, !Ref SharedDatabaseSecretArn, !Ref AWS::NoValue]
                  - !If [StudioReadsCharacterDatabase, !Ref CharacterDatabaseSecret, !Ref AWS::NoValue]
        # Wakes the idle-stopped studio (STUDIO_INSTANCE_ID). DescribeInstances has no resource-level permissions.
        - !If
          - HasStudioInstance
          - PolicyName: MogaesupStudioPower
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ec2:DescribeInstances
                  Resource: '*'
                - Effect: Allow
                  Action: ec2:StartInstances
                  Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${StudioInstanceId}'
          - !Ref AWS::NoValue
      Tags: [{Key: application, Value: mogaesup}]
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      CreditSpecification: {CPUCredits: standard}
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetA
          GroupSet: [!GetAtt ApiSecurityGroup.GroupId]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eu
          useradd --system --home-dir /opt/mogaesup --shell /sbin/nologin mogaesup
          install -d -m 750 -o mogaesup -g mogaesup /opt/mogaesup
          # Catalog models imported from the character server live here, outside the release directories.
          install -d -m 750 -o mogaesup -g mogaesup /var/lib/mogaesup /var/lib/mogaesup/blobs
          systemctl enable --now amazon-ssm-agent
      Tags: [{Key: application, Value: mogaesup}, {Key: Name, Value: mogaesup-server}]
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: mogaesup-server
        Arn: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ApiInstance}'
        HTTPPort: 8080
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols: [TLSv1.2]
Outputs:
  InstanceId: {Value: !Ref ApiInstance}
  RuntimeBucket: {Value: !Ref RuntimeBucket}
  DatabaseEndpoint: {Value: !If [UseSharedDatabase, !Ref SharedDatabaseEndpoint, !GetAtt Database.Endpoint.Address]}
  DatabaseSecretArn: {Value: !If [UseSharedDatabase, !Ref SharedDatabaseSecretArn, !GetAtt Database.MasterUserSecret.SecretArn]}
  RealtimeTicketSecretArn: {Value: !Ref RealtimeTicketSecret}
  CharacterDatabaseSecretArn:
    Condition: StudioReadsCharacterDatabase
    Value: !Ref CharacterDatabaseSecret
  FactoryGatewaySecretArn: {Value: !Ref FactoryGatewaySecret}
  VpcOriginId: {Value: !GetAtt VpcOrigin.Id}
  ApiPrivateDns: {Value: !GetAtt ApiInstance.PrivateDnsName}
  ApiSecurityGroupId: {Value: !GetAtt ApiSecurityGroup.GroupId}
