# The monorepo's Python environment: a uv workspace whose one member is the character server (backend/), so
# `uv sync` at the root sets up what backend tests, scripts/dev.ps1 and scripts/props/generate.py run.
[project]
name = "mogaesup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["asset-3d-api"]

[project.optional-dependencies]
studio-mcp = ["asset-3d-api[studio-mcp]"]
blender = ["asset-3d-api[blender]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
asset-3d-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
