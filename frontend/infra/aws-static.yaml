AWSTemplateFormatVersion: '2010-09-09'
Description: Mogaesup web app on private S3 behind CloudFront (OAC), with /api/* (REST and live-room WebSocket) sent to the Rust server's VPC origin.

Parameters:
  BucketName:
    Type: String
    Default: mogaesup-web-960243570517-apne2
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  ApiVpcOriginId:
    Type: String
    Default: ''
    Description: VpcOriginId output of the mogaesup-server stack.
  ApiPrivateDns:
    Type: String
    Default: ''
    Description: ApiPrivateDns output of the mogaesup-server stack.
  DomainName:
    Type: String
    Default: ''
    Description: Site hostname, e.g. mogaesup.com. Empty serves the CloudFront hostname only.
  RedirectDomainName:
    Type: String
    Default: ''
    Description: Optional second hostname (e.g. www.mogaesup.com) that redirects to DomainName.
  CertificateArn:
    Type: String
    Default: ''
    Description: Issued ACM certificate in us-east-1 covering DomainName and RedirectDomainName.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone that receives alias records for the hostnames.

Rules:
  DomainCertificatePair:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref DomainName, '']
            - !Equals [!Ref CertificateArn, '']
          - !And
            - !Not [!Equals [!Ref DomainName, '']]
            - !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: DomainName and CertificateArn must be supplied together.

Conditions:
  HasApi: !Not [!Equals [!Ref ApiVpcOriginId, '']]
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasRedirect: !And [!Condition HasDomain, !Not [!Equals [!Ref RedirectDomainName, '']]]
  HasZone: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, '']]]
  HasZoneRedirect: !And [!Condition HasZone, !Condition HasRedirect]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRollbackVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: application
          Value: mogaesup

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: SigV4 access from the Mogaesup distribution only
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  HtmlCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-html-short'
        Comment: Short cache for index.html and other files without a content hash
        DefaultTTL: 60
        MaxTTL: 300
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  HashedAssetCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-hashed-assets-long'
        Comment: One year immutable cache for Vite content-hashed assets
        DefaultTTL: 31536000
        MaxTTL: 31536000
        MinTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # The engine's WebAssembly keeps its name across engine releases while the hashed script that loads it changes. The
  # deploy uploads it with Cache-Control no-cache, right before index.html; with MinTTL 0 the edges honour that and ask
  # S3 whether it changed (a 304 when it did not), so a new script never meets a day-old WebAssembly at the edge.
  StaticRevalidateCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-static-revalidate'
        Comment: Engine WebAssembly without a content hash; the origin's no-cache makes every edge request revalidate
        DefaultTTL: 3600
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  StaticFileCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-static-day'
        Comment: A day at the edge for models and fonts without a content hash; deploys invalidate them
        DefaultTTL: 86400
        MaxTTL: 604800
        MinTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          # What the built app needs (checked in Chrome on the island with GI and the live room, and the wardrobe):
          # script-src: the bundles, the inline theme script of frontend/index.html by its sha256, WebAssembly (physics,
          # gaesup_core, the GI worker). When that inline script changes, put its new hash here and deploy this stack;
          # until then browsers skip it (dark themes flash light) and Chrome's console names the hash it expected.
          # style-src 'unsafe-inline': the engine renders <style> elements (its toast keyframes), whose hashes would change
          # with each engine release. img-src data: and connect-src blob:: the engine's SVG textures and three.js reading
          # GLB textures from blob: URLs. worker-src blob:: the GI worker. connect-src names the live room's wss: on this
          # host as well: browsers that predate CSP Level 3 do not count it as 'self'.
          # Not allowed: the engine's Draco decoder, which it loads from a fixed https://www.gstatic.com/draco/ address
          # (no setting moves it here). No model the site serves is Draco-compressed (the build packs with Meshopt); one
          # that is fails to load, so imports should refuse KHR_draco_mesh_compression.
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub
              - >-
                default-src 'self';
                script-src 'self' 'sha256-D2PZNR0vxjZdeZxPL0VCEkMuwUEEIyIKks6viRiCnIQ=' 'wasm-unsafe-eval';
                style-src 'self' 'unsafe-inline';
                img-src 'self' data: blob:;
                media-src 'self' data: blob:;
                font-src 'self';
                connect-src 'self' blob:${LiveRoom};
                worker-src 'self' blob:;
                object-src 'none';
                base-uri 'none';
                form-action 'self';
                frame-ancestors 'none'
              - LiveRoom: !If [HasDomain, !Sub ' wss://${DomainName}', '']
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: >-
                accelerometer=(), bluetooth=(), camera=(), display-capture=(), fullscreen=(self), gamepad=(self),
                geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(),
                usb=()
              Override: true

  SiteRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-site-request'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect the second hostname to the site; serve index.html for extensionless routes such as /@username
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            var host = request.headers.host ? request.headers.host.value : '';
            if ('${Redirect}' !== '' && host === '${Redirect}') {
              // Keys and values arrive percent-encoded as the viewer sent them, so they go on unchanged.
              var query = [];
              for (var key in request.querystring) {
                var field = request.querystring[key];
                var values = field.multiValue || [field];
                for (var i = 0; i < values.length; i++) query.push(key + '=' + values[i].value);
              }
              var target = 'https://${Site}' + request.uri + (query.length ? '?' + query.join('&') : '');
              return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: target } } };
            }
            var uri = request.uri;
            var segment = uri.substring(uri.lastIndexOf('/') + 1);
            if (uri.endsWith('/') || segment.indexOf('.') === -1) {
              request.uri = '/index.html';
            }
            return request;
          }
        - Redirect: !If [HasRedirect, !Ref RedirectDomainName, '']
          Site: !Ref DomainName

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Mogaesup web app and API
        DefaultRootObject: index.html
        Enabled: true
        Aliases: !If
          - HasDomain
          - !If [HasRedirect, [!Ref DomainName, !Ref RedirectDomainName], [!Ref DomainName]]
          - !Ref AWS::NoValue
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: private-s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - !If
            - HasApi
            - Id: rust-server-origin
              DomainName: !Ref ApiPrivateDns
              VpcOriginConfig:
                VpcOriginId: !Ref ApiVpcOriginId
                OriginReadTimeout: 30
                OriginKeepaliveTimeout: 5
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: private-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref HtmlCachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteRequestFunction.FunctionARN
        CacheBehaviors:
          - !If
            - HasApi
            # REST and the /api/rooms/* WebSocket upgrade; nothing cached, every viewer header but Host forwarded
            # (the server checks Origin and reads the session cookie).
            - PathPattern: api/*
              TargetOriginId: rust-server-origin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            - !Ref AWS::NoValue
          # Catalog models and pictures the server copies in, named by their SHA-256.
          - PathPattern: models/*
            TargetOriginId: private-s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref HashedAssetCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: gltf/*
            TargetOriginId: private-s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref StaticFileCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: wasm/*
            TargetOriginId: private-s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref StaticRevalidateCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: fonts/*
            TargetOriginId: private-s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref StaticFileCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: assets/*
            TargetOriginId: private-s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref HashedAssetCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: application
          Value: mogaesup

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  SiteRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}

  RedirectRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasZoneRedirect
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref RedirectDomainName
          Type: A
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Ref RedirectDomainName
          Type: AAAA
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}

Outputs:
  BucketName:
    Description: Private deployment bucket
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront hostname
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Description: HTTPS application URL
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
